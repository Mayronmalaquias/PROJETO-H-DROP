; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
; --- Escolha O QUE compilar (deixe só UMA linha ativa) ----------
; Projeto completo (ultrassônicos filtro-5-camadas + MPU) — referência ETAPA 6 + ETAPA 2:
; build_src_filter = +<main.cpp>
; Só MPU-6050 (diagnóstico I2C isolado):
build_src_filter = +<mpu.cpp>
; Só ultrassônicos com filtro 5 camadas (referência hdrop_avoidance):
; build_src_filter = +<ultrassonicos.cpp>